<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101828">
    <title>Моё пространство</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            background: #f7f9fc;
            color: #172033;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-width: 320px;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 8% -8%, #dce9ff 0, transparent 32rem),
                radial-gradient(circle at 100% 5%, #dff5ee 0, transparent 26rem),
                #f7f9fc;
        }

        button, input { font: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }

        button:focus-visible, input:focus-visible, a:focus-visible {
            outline: 3px solid rgba(47, 111, 236, 0.28);
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .shell {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
            padding: 28px 0 72px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 56px;
            padding: 12px 0;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #101828;
            font-size: 18px;
            font-weight: 760;
            letter-spacing: -0.02em;
        }

        .mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #3478f6, #205bc5);
            box-shadow: 0 8px 18px rgba(47, 111, 236, 0.24);
        }

        .mark::before {
            width: 15px;
            height: 11px;
            content: "";
            border: 2px solid #fff;
            border-radius: 4px;
            box-shadow: 8px 0 0 -4px #2f6fec, 8px 0 0 -2px #fff;
        }

        .header-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
        }

        .materials-link, .local-note {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            padding: 0 12px;
            border: 1px solid #d8e0ec;
            border-radius: 999px;
            color: #475467;
            background: rgba(255, 255, 255, 0.72);
            margin: 0;
            font-size: 14px;
            text-decoration: none;
        }

        .materials-link:hover {
            border-color: #b9cef6;
            color: #175cd3;
            background: #fff;
        }

        .intro {
            max-width: 700px;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 10px;
            color: #101828;
            font-size: clamp(34px, 5vw, 50px);
            font-weight: 780;
            letter-spacing: -0.045em;
            line-height: 1.08;
        }

        .intro p {
            margin: 0;
            color: #667085;
            font-size: 17px;
            line-height: 1.6;
        }

        .create-card {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            padding: 10px;
            margin-bottom: 48px;
            border: 1px solid #d8e0ec;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 14px 32px rgba(16, 24, 40, 0.07);
        }

        input {
            min-width: 0;
            height: 50px;
            padding: 0 16px;
            border: 1px solid #e5eaf2;
            border-radius: 12px;
            outline: none;
            color: #172033;
            background: #f7f9fc;
        }

        input:focus {
            border-color: #74a0f7;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(47, 111, 236, 0.14);
        }

        button {
            min-height: 40px;
            min-width: 0;
            padding: 0 14px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 650;
            transition: transform 120ms ease, background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
        }

        button:active { transform: translateY(1px); }

        .primary {
            min-height: 50px;
            color: #fff;
            background: linear-gradient(135deg, #3478f6, #245fd1);
            box-shadow: 0 6px 14px rgba(47, 111, 236, 0.2);
        }

        .primary:hover { background: #235fd8; box-shadow: 0 8px 18px rgba(47, 111, 236, 0.28); }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        h2 {
            margin: 0;
            color: #1d2939;
            font-size: 21px;
            letter-spacing: -0.02em;
        }

        .meeting-count {
            color: #667085;
            font-size: 14px;
        }

        .meetings {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
            gap: 18px;
        }

        .meeting {
            display: flex;
            min-height: 238px;
            flex-direction: column;
            padding: 22px;
            border: 1px solid #dce2ed;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 7px 18px rgba(16, 24, 40, 0.045);
            transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
        }

        .meeting:hover {
            border-color: #cbd8ee;
            box-shadow: 0 14px 28px rgba(16, 24, 40, 0.08);
            transform: translateY(-2px);
        }

        .meeting h3 {
            overflow: hidden;
            margin: 0 0 9px;
            color: #172033;
            font-size: 18px;
            font-weight: 740;
            letter-spacing: -0.015em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .meeting time {
            color: #667085;
            font-size: 13px;
        }

        .meeting-actions {
            display: flex;
            align-items: center;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
            margin-top: auto;
            padding-top: 22px;
        }

        .meeting-actions button {
            width: 100%;
            overflow-wrap: anywhere;
            white-space: normal;
        }

        .open { grid-column: 1 / -1; }

        .quiet {
            border: 1px solid #d8e0ec;
            color: #344054;
            background: #fff;
            font-size: 14px;
        }

        .quiet:hover { border-color: #bdcbe0; background: #f8fafc; }

        .remove {
            grid-column: 1 / -1;
            border-color: transparent;
            color: #b42318;
            background: #fff6f5;
        }

        .remove:hover { border-color: #fecdca; background: #fff1f0; }

        .empty {
            display: grid;
            min-height: 240px;
            place-items: center;
            padding: 32px;
            border: 1px dashed #c9d3e4;
            border-radius: 18px;
            text-align: center;
            background: rgba(255, 255, 255, 0.68);
        }

        .empty strong { display: block; margin-bottom: 7px; font-size: 17px; }
        .empty span { color: #667085; font-size: 14px; }

        .toast {
            position: fixed;
            right: max(20px, env(safe-area-inset-right));
            bottom: max(20px, env(safe-area-inset-bottom));
            z-index: 10;
            padding: 12px 16px;
            max-width: calc(100% - 40px);
            border-radius: 12px;
            color: #fff;
            background: #172033;
            box-shadow: 0 8px 20px rgba(16, 24, 40, 0.2);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: opacity 160ms ease, transform 160ms ease;
        }

        .toast.visible { opacity: 1; transform: translateY(0); }

        @media (max-width: 600px) {
            .shell { width: min(100% - 28px, 1120px); padding-top: 16px; }
            header { align-items: flex-start; flex-direction: column; margin-bottom: 38px; }
            .header-actions { justify-content: flex-start; }
            .local-note { display: none; }
            .create-card { grid-template-columns: 1fr; }
            .create-card .primary { width: 100%; }
            .meeting { min-height: 0; padding: 18px; }
        }

        @media (max-width: 380px) {
            .shell { width: min(100% - 24px, 1120px); }
            .meeting-actions { grid-template-columns: 1fr; }
            .open, .remove { grid-column: auto; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header>
            <div class="brand"><span class="mark" aria-hidden="true"></span><span>Моё пространство</span></div>
            <div class="header-actions"><a class="materials-link" href="/materials/meetings">Материалы встреч</a><p class="local-note">Локальный профиль</p></div>
        </header>

        <section class="intro" aria-labelledby="page-title">
            <h1 id="page-title">Ваши встречи</h1>
            <p>Создавайте постоянные ссылки на конференции и возвращайтесь к ним в любое время.</p>
        </section>

        <form id="create-form" class="create-card">
            <label class="sr-only" for="meeting-name">Название встречи</label>
            <input id="meeting-name" maxlength="80" autocomplete="off" placeholder="Например, Еженедельная встреча команды">
            <button class="primary" type="submit">Создать встречу</button>
        </form>

        <section aria-labelledby="meetings-title">
            <div class="section-header">
                <h2 id="meetings-title">Мои встречи</h2>
                <span id="meeting-count" class="meeting-count"></span>
            </div>
            <div id="meetings" class="meetings" aria-live="polite"></div>
        </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        (() => {
            const storageKey = 'local-conference-meetings-v1';
            const meetingsElement = document.getElementById('meetings');
            const countElement = document.getElementById('meeting-count');
            const form = document.getElementById('create-form');
            const nameInput = document.getElementById('meeting-name');
            const toast = document.getElementById('toast');
            let toastTimer;

            const readMeetings = () => {
                try {
                    const value = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    return Array.isArray(value) ? value.filter(item => item && item.id && item.name) : [];
                } catch {
                    return [];
                }
            };

            const saveMeetings = meetings => localStorage.setItem(storageKey, JSON.stringify(meetings));

            const makeRoomId = () => {
                const random = window.crypto?.randomUUID?.().replaceAll('-', '')
                    || `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;

                return `meeting-${random.slice(0, 18)}`;
            };

            const roomUrl = id => `${location.origin}/${encodeURIComponent(id)}`;

            const formatDate = value => new Intl.DateTimeFormat('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            }).format(new Date(value));

            const showToast = text => {
                clearTimeout(toastTimer);
                toast.textContent = text;
                toast.classList.add('visible');
                toastTimer = setTimeout(() => toast.classList.remove('visible'), 2400);
            };

            const makeButton = (text, className, onClick) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = className;
                button.textContent = text;
                button.addEventListener('click', onClick);

                return button;
            };

            const render = () => {
                const meetings = readMeetings();
                meetingsElement.replaceChildren();
                countElement.textContent = meetings.length ? `${meetings.length} ${meetings.length === 1 ? 'встреча' : 'встречи'}` : '';

                if (!meetings.length) {
                    const empty = document.createElement('div');
                    empty.className = 'empty';
                    empty.innerHTML = '<div><strong>Встреч пока нет</strong><span>Создайте первую встречу выше — ссылка останется в этом списке.</span></div>';
                    meetingsElement.append(empty);

                    return;
                }

                meetings.forEach(meeting => {
                    const card = document.createElement('article');
                    card.className = 'meeting';
                    const title = document.createElement('h3');
                    title.textContent = meeting.name;
                    title.title = meeting.name;
                    const date = document.createElement('time');
                    date.dateTime = meeting.createdAt;
                    date.textContent = `Создана ${formatDate(meeting.createdAt)}`;
                    const actions = document.createElement('div');
                    actions.className = 'meeting-actions';

                    actions.append(
                        makeButton('Открыть конференцию', 'primary open', () => { location.href = roomUrl(meeting.id); }),
                        makeButton('Материалы', 'quiet', () => { location.href = `/materials/meeting/${encodeURIComponent(meeting.id)}`; }),
                        makeButton('Копировать ссылку', 'quiet', async () => {
                            try {
                                await navigator.clipboard.writeText(roomUrl(meeting.id));
                                showToast('Ссылка скопирована');
                            } catch {
                                window.prompt('Скопируйте ссылку:', roomUrl(meeting.id));
                            }
                        }),
                        makeButton('Удалить из списка', 'quiet remove', () => {
                            if (!window.confirm(`Убрать «${meeting.name}» из списка? Конференция и её материалы останутся доступны по ссылке.`)) {
                                return;
                            }
                            const remaining = readMeetings().filter(item => item.id !== meeting.id);
                            saveMeetings(remaining);
                            render();
                            showToast('Встреча убрана из списка');
                        })
                    );
                    card.append(title, date, actions);
                    meetingsElement.append(card);
                });
            };

            form.addEventListener('submit', event => {
                event.preventDefault();
                const name = nameInput.value.trim() || 'Новая встреча';
                const meeting = { id: makeRoomId(), name, createdAt: new Date().toISOString() };
                const meetings = readMeetings();
                meetings.unshift(meeting);
                saveMeetings(meetings);
                location.href = roomUrl(meeting.id);
            });

            render();
        })();
    </script>
</body>
</html>
