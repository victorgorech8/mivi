# Local personal space. This exact route takes precedence over Jitsi's default
# welcome page; room paths such as /team-meeting continue to be served by Jitsi.
location = / {
    root /run/web/config;
    try_files /personal-space.html =404;
    add_header Cache-Control "no-store";
}

# Keep Outlook add-in assets outside the Jitsi room route. The ^~ prefix ensures
# the room-name regular expression cannot treat outlook-addin as a meeting.
location ^~ /outlook-addin/ {
    alias /run/web/config/outlook-addin/;
    add_header Cache-Control "no-store";
}

# Shared meeting notes and recordings live in a separate authenticated service.
# This keeps its URLs out of Jitsi's room routing and does not alter conferences.
location = /materials {
    return 301 /materials/;
}

location ^~ /materials/ {
    proxy_pass http://materials:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /materials;
    proxy_read_timeout 3600s;
    client_max_body_size 16k;
}
